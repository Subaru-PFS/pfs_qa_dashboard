name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      # drp_qa and pfs_utils are not installable from PyPI, and drp_qa's own
      # install would pull pfs_utils' dependencies from git: put drp_qa's
      # python/ on PYTHONPATH, and install pfs_utils without its dependencies,
      # as drp_qa's CI does. Track its main (not a pinned tag) — the two repos
      # release together, and the dashboard reads qadb (pfs.drp.qa.qadb.reader)
      # and labels shaka exposures (pfs.drp.qa.comparison.classify.shakaOf) from it.
      - uses: actions/checkout@v4
        with:
          repository: Subaru-PFS/drp_qa
          ref: main
          path: drp_qa

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-deps "pfs-utils @ git+https://github.com/Subaru-PFS/pfs_utils.git"
          python -m pip install numpy pandas pyarrow pyyaml scipy sqlalchemy tornado matplotlib seaborn pytest

      - name: Run tests
        env:
          PYTHONPATH: python:drp_qa/python
        run: pytest -v tests
