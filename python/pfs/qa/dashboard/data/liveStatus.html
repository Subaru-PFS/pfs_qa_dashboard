<style>
  #live {
    position: fixed; right: 12px; bottom: 12px; z-index: 10; max-width: min(60ch, calc(100vw - 24px)); padding: 4px 12px;
    border: 1px solid var(--rule); border-radius: 14px; background: var(--surface); color: var(--fg-3);
    font-size: 0.8rem; font-variant-numeric: tabular-nums;
  }
  #live:empty { display: none; }
  #live.bad { border-color: var(--fail); background: var(--fail-bg); color: var(--fail); font-weight: 600; }
  @media print { #live { display: none; } }
</style>
<div id="live" role="status"></div>
<script>
  // Served live: ask the server whether it has made a newer page, and say when it last read its results.
  (() => {
    const built = {{BUILT}}, live = document.getElementById("live");
    let lost = null;
    // What the reader chose, kept across the reload this script makes: the boxes, the buttons and the place.
    function keepView() {
      const view = { scroll: window.scrollY, fields: {}, pressed: {} };
      document.querySelectorAll("input[id], select[id]").forEach((el) => { view.fields[el.id] = el.type === "checkbox" ? el.checked : el.value; });
      document.querySelectorAll(".seg[data-group]").forEach((group) => {
        const button = group.querySelector('button[aria-pressed="true"]');
        if (button) view.pressed[group.dataset.group] = button.dataset.value;
      });
      try { sessionStorage.setItem("runReport.view", JSON.stringify(view)); } catch (error) { /* no storage: the view starts afresh */ }
    }
    function restoreView() {
      let view = null;
      try { view = JSON.parse(sessionStorage.getItem("runReport.view")); sessionStorage.removeItem("runReport.view"); } catch (error) { return; }
      if (!view) return;
      for (const [group, value] of Object.entries(view.pressed)) {
        const button = [...document.querySelectorAll(`.seg[data-group="${group}"] button`)].find((b) => b.dataset.value === value);
        if (button && button.getAttribute("aria-pressed") !== "true") button.click();
      }
      for (const [id, value] of Object.entries(view.fields)) {
        const el = document.getElementById(id);
        if (!el || (el.type === "checkbox" ? el.checked : el.value) === value) continue;
        if (el.type === "checkbox") el.checked = value; else el.value = value;
        el.dispatchEvent(new Event(el.type === "search" ? "input" : "change", { bubbles: true }));
      }
      window.scrollTo(0, view.scroll);
    }
    async function poll() {
      try {
        const response = await fetch("status", { cache: "no-store" });
        if (!response.ok) throw new Error(response.status);
        const status = await response.json();
        lost = null;
        if (status.built !== built) { keepView(); location.reload(); return; }
        const bad = Boolean(status.error) || status.stale;
        live.className = bad ? "bad" : "";
        live.textContent = bad
          ? `Results not read since ${status.readAt} HST` + (status.error ? `: ${status.error}` : "")
          : `Results read ${status.readAt} HST`;
      } catch (error) {
        lost = lost || new Date().toLocaleTimeString("en-GB", { timeZone: "Pacific/Honolulu" });
        live.className = "bad";
        live.textContent = `The server has not answered since ${lost} HST`;
      }
    }
    restoreView();
    poll();
    setInterval(poll, {{POLL_MS}});
  })();
</script>
